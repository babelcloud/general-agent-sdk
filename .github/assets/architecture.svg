      <text x="182" y="370" fill="#667085" font-size="7"></text>
      <text x="194" y="370" fill="#00d4ff" font-size="10">write</text>
      <text x="205" y="384" text-anchor="middle" fill="#555" font-size="7">create</text>
      
      <rect x="260" y="358" width="90" height="36" rx="6" fill="#00d4ff" fill-opacity="0.06" stroke="#00d4ff" stroke-opacity="0.15"/>
      <text x="282" y="370" fill="#667085" font-size="7">='</text>
      <text x="294" y="370" fill="#00d4ff" font-size="10">edit</text>
      <text x="305" y="384" text-anchor="middle" fill="#555" font-size="7">surgical</text>
      
      <rect x="360" y="358" width="90" height="36" rx="6" fill="#7b61ff" fill-opacity="0.06" stroke="#7b61ff" stroke-opacity="0.15"/>
      <text x="382" y="370" fill="#667085" font-size="7">¡</text>
      <text x="394" y="370" fill="#9d8aff" font-size="10">exec</text>
      <text x="405" y="384" text-anchor="middle" fill="#555" font-size="7">shell</text>

      <rect x="460" y="358" width="112" height="36" rx="6" fill="#7b61ff" fill-opacity="0.06" stroke="#7b61ff" stroke-opacity="0.15"/>
      <text x="482" y="370" fill="#667085" font-size="7">=</text>
      <text x="494" y="370" fill="#9d8aff" font-size="10">web_search</text>
      <text x="516" y="384" text-anchor="middle" fill="#555" font-size="7">search</text>

      <rect x="582" y="358" width="108" height="36" rx="6" fill="#7b61ff" fill-opacity="0.06" stroke="#7b61ff" stroke-opacity="0.15"/>
      <text x="604" y="370" fill="#667085" font-size="7"><</text>
      <text x="616" y="370" fill="#9d8aff" font-size="10">web_fetch</text>
      <text x="636" y="384" text-anchor="middle" fill="#555" font-size="7">pages</text>

      <rect x="700" y="358" width="100" height="36" rx="6" fill="#ff6b9d" fill-opacity="0.06" stroke="#ff6b9d" stroke-opacity="0.15"/>
      <text x="722" y="370" fill="#667085" font-size="7">></text>
      <text x="734" y="370" fill="#ff6b9d" font-size="10">subagents</text>
      <text x="750" y="384" text-anchor="middle" fill="#555" font-size="7">delegate</text>

      <rect x="810" y="358" width="100" height="36" rx="6" fill="#ff6b9d" fill-opacity="0.06" stroke="#ff6b9d" stroke-opacity="0.15"/>
      <text x="832" y="370" fill="#667085" font-size="7">=Ë</text>
      <text x="844" y="370" fill="#ff6b9d" font-size="10">apply_patch</text>
      <text x="860" y="384" text-anchor="middle" fill="#555" font-size="7">diff</text>
