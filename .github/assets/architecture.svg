      <text x="125" y="125" text-anchor="middle" font-family="'SF Mono', monospace" font-size="11" fill="#00d4ff">Credentials</text>
      <text x="125" y="143" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#667085">API keys, env vars</text>
    </g>
    <g filter="url(#cardShadow)">
      <rect x="210" y="100" width="130" height="56" rx="8" fill="#0d1117" stroke="#00d4ff" stroke-opacity="0.2" stroke-width="1"/>
      <text x="275" y="125" text-anchor="middle" font-family="'SF Mono', monospace" font-size="11" fill="#00d4ff">Persistence</text>
      <text x="275" y="143" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#667085">Session files, logs</text>
