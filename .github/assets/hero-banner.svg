<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f0f23"/>
      <stop offset="50%" stop-color="#1a1a3e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#7b61ff"/>
      <stop offset="100%" stop-color="#ff6b9d"/>
    </linearGradient>
    <linearGradient id="glow" x1="300" y1="100" x2="900" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7b61ff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="roundRect">
      <rect width="1200" height="320" rx="16"/>
    </clipPath>
  </defs>
  
  <!-- Background -->
  <g clip-path="url(#roundRect)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    
    <!-- Ambient glow orbs -->
    <circle cx="200" cy="160" r="200" fill="#00d4ff" opacity="0.06" filter="url(#blur2)"/>
    <circle cx="900" cy="100" r="180" fill="#7b61ff" opacity="0.08" filter="url(#blur2)"/>
    <circle cx="1050" cy="260" r="120" fill="#ff6b9d" opacity="0.05" filter="url(#blur1)"/>
    
    <!-- Grid pattern -->
    <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
      <line x1="0" y1="80" x2="1200" y2="80"/>
      <line x1="0" y1="160" x2="1200" y2="160"/>
      <line x1="0" y1="240" x2="1200" y2="240"/>
      <line x1="200" y1="0" x2="200" y2="320"/>
      <line x1="400" y1="0" x2="400" y2="320"/>
      <line x1="600" y1="0" x2="600" y2="320"/>
      <line x1="800" y1="0" x2="800" y2="320"/>
      <line x1="1000" y1="0" x2="1000" y2="320"/>
    </g>
    
    <!-- Decorative data flow dots -->
    <g fill="#00d4ff" opacity="0.4">
      <circle cx="120" cy="80" r="2"/>
      <circle cx="200" cy="80" r="2"/>
      <circle cx="280" cy="80" r="2"/>
      <circle cx="920" cy="240" r="2"/>
      <circle cx="1000" cy="240" r="2"/>
      <circle cx="1080" cy="240" r="2"/>
    </g>
    <g fill="#7b61ff" opacity="0.3">
      <circle cx="400" cy="240" r="2"/>
      <circle cx="480" cy="240" r="2"/>
      <circle cx="720" cy="80" r="2"/>
      <circle cx="800" cy="80" r="2"/>
    </g>
    
    <!-- Icon: Agent brain circuit -->
    <g transform="translate(460, 52)" opacity="0.9">
      <!-- Outer ring -->
      <circle cx="32" cy="32" r="30" stroke="url(#accent)" stroke-width="2" fill="none" opacity="0.6"/>
      <!-- Inner core -->
      <circle cx="32" cy="32" r="12" fill="url(#accent)" opacity="0.3"/>
      <circle cx="32" cy="32" r="6" fill="#00d4ff"/>
      <!-- Circuit lines -->
      <line x1="32" y1="2" x2="32" y2="18" stroke="#00d4ff" stroke-width="1.5" opacity="0.7"/>
      <line x1="32" y1="46" x2="32" y2="62" stroke="#7b61ff" stroke-width="1.5" opacity="0.7"/>
      <line x1="2" y1="32" x2="18" y2="32" stroke="#00d4ff" stroke-width="1.5" opacity="0.7"/>
      <line x1="46" y1="32" x2="62" y2="32" stroke="#ff6b9d" stroke-width="1.5" opacity="0.7"/>
      <!-- Diagonal connections -->
      <line x1="10" y1="10" x2="21" y2="21" stroke="#00d4ff" stroke-width="1" opacity="0.4"/>
      <line x1="43" y1="10" x2="54" y2="21" stroke="#7b61ff" stroke-width="1" opacity="0.4" transform="rotate(90,32,32)"/>
      <!-- Small nodes -->
      <circle cx="32" cy="2" r="2" fill="#00d4ff"/>
      <circle cx="32" cy="62" r="2" fill="#7b61ff"/>
      <circle cx="2" cy="32" r="2" fill="#00d4ff"/>
      <circle cx="62" cy="32" r="2" fill="#ff6b9d"/>
    </g>
    
    <!-- Title -->
    <text x="600" y="155" text-anchor="middle" font-family="'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="white" letter-spacing="-1" filter="url(#textGlow)">General Agent SDK</text>
    
    <!-- Subtitle -->
    <text x="600" y="195" text-anchor="middle" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', monospace" font-size="17" fill="#a0a8c0" letter-spacing="1">Build AI agents that actually do things.</text>
    
    <!-- Accent line -->
    <rect x="480" y="215" width="240" height="2" rx="1" fill="url(#accent)" opacity="0.6"/>
    
    <!-- Tag pills -->
    <g font-family="'SF Mono', 'Fira Code', monospace" font-size="11" letter-spacing="0.5">
      <!-- Streaming -->
      <rect x="310" y="235" width="100" height="26" rx="13" fill="#00d4ff" fill-opacity="0.1" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="1"/>
      <text x="360" y="252" text-anchor="middle" fill="#00d4ff">Streaming</text>
      <!-- Tools -->
      <rect x="425" y="235" width="80" height="26" rx="13" fill="#7b61ff" fill-opacity="0.1" stroke="#7b61ff" stroke-opacity="0.3" stroke-width="1"/>
      <text x="465" y="252" text-anchor="middle" fill="#9d8aff">Tools</text>
      <!-- Sessions -->
      <rect x="520" y="235" width="90" height="26" rx="13" fill="#ff6b9d" fill-opacity="0.1" stroke="#ff6b9d" stroke-opacity="0.3" stroke-width="1"/>
      <text x="565" y="252" text-anchor="middle" fill="#ff6b9d">Sessions</text>
      <!-- Hooks -->
      <rect x="625" y="235" width="76" height="26" rx="13" fill="#00d4ff" fill-opacity="0.1" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="1"/>
      <text x="663" y="252" text-anchor="middle" fill="#00d4ff">Hooks</text>
      <!-- MCP -->
      <rect x="716" y="235" width="65" height="26" rx="13" fill="#7b61ff" fill-opacity="0.1" stroke="#7b61ff" stroke-opacity="0.3" stroke-width="1"/>
      <text x="748" y="252" text-anchor="middle" fill="#9d8aff">MCP</text>
      <!-- Subagents -->
      <rect x="796" y="235" width="100" height="26" rx="13" fill="#ff6b9d" fill-opacity="0.1" stroke="#ff6b9d" stroke-opacity="0.3" stroke-width="1"/>
      <text x="846" y="252" text-anchor="middle" fill="#ff6b9d">Subagents</text>
    </g>
    
    <!-- Version badge -->
    <g transform="translate(550, 280)">
      <rect width="100" height="22" rx="4" fill="#ffffff" fill-opacity="0.08"/>
      <text x="50" y="15" text-anchor="middle" font-family="'SF Mono', monospace" font-size="11" fill="#8890a8">v0.1.0 · MIT</text>
    </g>
  </g>
</svg>
