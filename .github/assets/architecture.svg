        <text x="24" y="16" text-anchor="middle" font-family="'SF Mono', monospace" font-size="9" fill="#9d8aff">LLM</text>
      </g>
      <text x="590" y="296" font-family="system-ui" font-size="11" fill="#555">’</text>
