    <!-- PPPPPPP HOST APP LAYER PPPPPPP -->
    <rect x="40" y="65" width="880" height="110" rx="10" fill="url(#hostGrad)" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="1"/>
    <text x="70" y="88" font-family="'SF Mono', monospace" font-size="10" fill="#00d4ff" letter-spacing="2" text-transform="uppercase" opacity="0.8">YOUR APPLICATION</text>
    
    <!-- Host boxes -->
