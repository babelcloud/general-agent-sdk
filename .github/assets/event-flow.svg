<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" fill="none">
  <defs>
    <linearGradient id="bgFlow" x1="0" y1="0" x2="960" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f0f23"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="960" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="33%" stop-color="#7b61ff"/>
      <stop offset="66%" stop-color="#ff6b9d"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="roundFlow">
      <rect width="960" height="220" rx="12"/>
    </clipPath>
  </defs>
  
  <g clip-path="url(#roundFlow)">
    <rect width="960" height="220" fill="url(#bgFlow)"/>
    
    <!-- Title -->
    <text x="480" y="30" text-anchor="middle" font-family="'SF Pro Display', system-ui, sans-serif" font-size="14" font-weight="700" fill="white" letter-spacing="0.5">Event Stream Timeline</text>
    
    <!-- Main timeline line -->
    <line x1="60" y1="100" x2="900" y2="100" stroke="url(#lineGrad)" stroke-width="2" opacity="0.4"/>
    
    <!-- Nodes -->
    <!-- 1. User Input -->
    <g transform="translate(80,100)" filter="url(#nodeGlow)">
      <circle r="14" fill="#0d1117" stroke="#00d4ff" stroke-width="2"/>
      <text y="4" text-anchor="middle" font-family="system-ui" font-size="11" fill="#00d4ff">U</text>
    </g>
    <text x="80" y="140" text-anchor="middle" font-family="'SF Mono', monospace" font-size="9" fill="#00d4ff">streamTurn()</text>
    <text x="80" y="155" text-anchor="middle" font-family="system-ui" font-size="8" fill="#555">user message</text>
    
    <!-- 2. Reasoning -->
    <g transform="translate(200,100)" filter="url(#nodeGlow)">
      <circle r="14" fill="#0d1117" stroke="#7b61ff" stroke-width="2"/>
      <text y="4" text-anchor="middle" font-family="system-ui" font-size="11" fill="#9d8aff">=­</text>
    </g>
    <text x="200" y="140" text-anchor="middle" font-family="'SF Mono', monospace" font-size="9" fill="#9d8aff">reasoning</text>
    <text x="200" y="155" text-anchor="middle" font-family="system-ui" font-size="8" fill="#555">_delta</text>
    
    <!-- 3. Assistant Delta -->
    <g transform="translate(320,100)" filter="url(#nodeGlow)">
      <circle r="14" fill="#0d1117" stroke="#7b61ff" stroke-width="2"/>
      <text y="4" text-anchor="middle" font-family="system-ui" font-size="11" fill="#9d8aff"></text>
    </g>
    <text x="320" y="140" text-anchor="middle" font-family="'SF Mono', monospace" font-size="9" fill="#9d8aff">assistant</text>
    <text x="320" y="155" text-anchor="middle" font-family="system-ui" font-size="8" fill="#555">_delta</text>
    
    <!-- 4. Tool Call -->
    <g transform="translate(440,100)" filter="url(#nodeGlow)">
      <circle r="14" fill="#0d1117" stroke="#ff6b9d" stroke-width="2"/>
      <text y="4" text-anchor="middle" font-family="system-ui" font-size="11" fill="#ff6b9d">='</text>
    </g>
    <text x="440" y="140" text-anchor="middle" font-family="'SF Mono', monospace" font-size="9" fill="#ff6b9d">tool_call</text>
    <text x="440" y="155" text-anchor="middle" font-family="system-ui" font-size="8" fill="#555">built-in or hosted</text>
    
    <!-- 5. Tool Result -->
    <g transform="translate(560,100)" filter="url(#nodeGlow)">
      <circle r="14" fill="#0d1117" stroke="#ff6b9d" stroke-width="2"/>
      <text y="4" text-anchor="middle" font-family="system-ui" font-size="11" fill="#ff6b9d"></text>
    </g>
    <text x="560" y="140" text-anchor="middle" font-family="'SF Mono', monospace" font-size="9" fill="#ff6b9d">tool_result</text>
    <text x="560" y="155" text-anchor="middle" font-family="system-ui" font-size="8" fill="#555">output returned</text>
    
    <!-- Loop-back arrow (tool ’ LLM ’ tool) -->
    <path d="M 575,82 C 575,55 440,55 440,82" stroke="#ff6b9d" stroke-width="1" fill="none" stroke-dasharray="4,3" opacity="0.5"/>
    <text x="508" y="52" text-anchor="middle" font-family="'SF Mono', monospace" font-size="7" fill="#ff6b9d" opacity="0.7">loops until done</text>
    
    <!-- 6. Usage Snapshot -->
    <g transform="translate(680,100)" filter="url(#nodeGlow)">
      <circle r="14" fill="#0d1117" stroke="#f59e0b" stroke-width="2"/>
      <text y="4" text-anchor="middle" font-family="system-ui" font-size="11" fill="#f59e0b">=Ê</text>
    </g>
    <text x="680" y="140" text-anchor="middle" font-family="'SF Mono', monospace" font-size="9" fill="#f59e0b">usage</text>
    <text x="680" y="155" text-anchor="middle" font-family="system-ui" font-size="8" fill="#555">_snapshot</text>
    
    <!-- 7. Turn Complete -->
    <g transform="translate(820,100)" filter="url(#nodeGlow)">
      <circle r="14" fill="#0d1117" stroke="#22c55e" stroke-width="2"/>
      <text y="4" text-anchor="middle" font-family="system-ui" font-size="11" fill="#22c55e"><Á</text>
    </g>
    <text x="820" y="140" text-anchor="middle" font-family="'SF Mono', monospace" font-size="9" fill="#22c55e">turn</text>
    <text x="820" y="155" text-anchor="middle" font-family="system-ui" font-size="8" fill="#555">_complete</text>
    
    <!-- Arrow connectors -->
    <g stroke-width="1" opacity="0.3">
      <line x1="94" y1="100" x2="186" y2="100" stroke="#00d4ff"/>
      <line x1="214" y1="100" x2="306" y2="100" stroke="#7b61ff"/>
      <line x1="334" y1="100" x2="426" y2="100" stroke="#7b61ff"/>
      <line x1="454" y1="100" x2="546" y2="100" stroke="#ff6b9d"/>
      <line x1="574" y1="100" x2="666" y2="100" stroke="#f59e0b"/>
      <line x1="694" y1="100" x2="806" y2="100" stroke="#22c55e"/>
    </g>
    
    <!-- Bottom note -->
    <text x="480" y="190" text-anchor="middle" font-family="'SF Mono', monospace" font-size="10" fill="#555">for await (const event of session.streamTurn(input)) { ... }</text>
    <text x="480" y="208" text-anchor="middle" font-family="system-ui" font-size="8" fill="#444">All events delivered via a single AsyncIterable  no callbacks, no observers</text>
  </g>
</svg>
