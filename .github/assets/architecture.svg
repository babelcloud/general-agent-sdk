    <!-- PPPPPPP TOOLS ROW PPPPPPP -->
    <text x="70" y="348" font-family="'SF Mono', monospace" font-size="9" fill="#667085" letter-spacing="1">TOOLS</text>
    
    <!-- Tool cards -->
    <g font-family="'SF Mono', monospace" font-size="10">
      <rect x="60" y="358" width="90" height="36" rx="6" fill="#00d4ff" fill-opacity="0.06" stroke="#00d4ff" stroke-opacity="0.15"/>
