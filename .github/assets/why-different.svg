<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" fill="none">
  <defs>
    <linearGradient id="bgWhy" x1="0" y1="0" x2="960" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f0f23"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <clipPath id="roundWhy">
      <rect width="960" height="200" rx="12"/>
    </clipPath>
  </defs>
  
  <g clip-path="url(#roundWhy)">
    <rect width="960" height="200" fill="url(#bgWhy)"/>
    
    <!-- VS divider -->
    <line x1="480" y1="20" x2="480" y2="180" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    <rect x="460" y="82" width="40" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="480" y="100" text-anchor="middle" font-family="'SF Pro Display', system-ui" font-size="11" font-weight="700" fill="#555">VS</text>
    
    <!-- LEFT: Other frameworks -->
    <text x="240" y="30" text-anchor="middle" font-family="'SF Pro Display', system-ui" font-size="13" font-weight="700" fill="#667085" letter-spacing="0.5">Other Agent Frameworks</text>
    
    <g font-family="system-ui, sans-serif" font-size="11" fill="#667085">
      <g transform="translate(60, 52)">
        <circle cx="6" cy="6" r="5" fill="#ff4444" fill-opacity="0.15" stroke="#ff4444" stroke-opacity="0.3"/>
        <text x="6" y="10" text-anchor="middle" font-size="8" fill="#ff4444"></text>
        <text x="20" y="10" fill="#888">Chat completion wrappers</text>
      </g>
      <g transform="translate(60, 78)">
        <circle cx="6" cy="6" r="5" fill="#ff4444" fill-opacity="0.15" stroke="#ff4444" stroke-opacity="0.3"/>
        <text x="6" y="10" text-anchor="middle" font-size="8" fill="#ff4444"></text>
        <text x="20" y="10" fill="#888">Framework-owned state you can't control</text>
      </g>
      <g transform="translate(60, 104)">
        <circle cx="6" cy="6" r="5" fill="#ff4444" fill-opacity="0.15" stroke="#ff4444" stroke-opacity="0.3"/>
        <text x="6" y="10" text-anchor="middle" font-size="8" fill="#ff4444"></text>
        <text x="20" y="10" fill="#888">Manual tool loop management</text>
      </g>
      <g transform="translate(60, 130)">
        <circle cx="6" cy="6" r="5" fill="#ff4444" fill-opacity="0.15" stroke="#ff4444" stroke-opacity="0.3"/>
        <text x="6" y="10" text-anchor="middle" font-size="8" fill="#ff4444"></text>
        <text x="20" y="10" fill="#888">Restart = lost state</text>
      </g>
      <g transform="translate(60, 156)">
        <circle cx="6" cy="6" r="5" fill="#ff4444" fill-opacity="0.15" stroke="#ff4444" stroke-opacity="0.3"/>
        <text x="6" y="10" text-anchor="middle" font-size="8" fill="#ff4444"></text>
        <text x="20" y="10" fill="#888">Callback-heavy APIs, hard to reason about</text>
      </g>
    </g>
    
    <!-- RIGHT: General Agent SDK -->
    <text x="720" y="30" text-anchor="middle" font-family="'SF Pro Display', system-ui" font-size="13" font-weight="700" fill="#00d4ff" letter-spacing="0.5">General Agent SDK</text>
    
    <g font-family="system-ui, sans-serif" font-size="11">
      <g transform="translate(520, 52)">
        <circle cx="6" cy="6" r="5" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-opacity="0.4"/>
        <text x="6" y="10" text-anchor="middle" font-size="8" fill="#22c55e"></text>
        <text x="20" y="10" fill="#ccc">Full autonomous execution engine</text>
      </g>
      <g transform="translate(520, 78)">
        <circle cx="6" cy="6" r="5" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-opacity="0.4"/>
        <text x="6" y="10" text-anchor="middle" font-size="8" fill="#22c55e"></text>
        <text x="20" y="10" fill="#ccc">Host-owned persistence &amp; credentials</text>
      </g>
      <g transform="translate(520, 104)">
        <circle cx="6" cy="6" r="5" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-opacity="0.4"/>
        <text x="6" y="10" text-anchor="middle" font-size="8" fill="#22c55e"></text>
        <text x="20" y="10" fill="#ccc">Agent runs tools autonomously until done</text>
      </g>
      <g transform="translate(520, 130)">
        <circle cx="6" cy="6" r="5" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-opacity="0.4"/>
        <text x="6" y="10" text-anchor="middle" font-size="8" fill="#22c55e"></text>
        <text x="20" y="10" fill="#ccc">Restart-safe hosted tool suspend/resume</text>
      </g>
      <g transform="translate(520, 156)">
        <circle cx="6" cy="6" r="5" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-opacity="0.4"/>
        <text x="6" y="10" text-anchor="middle" font-size="8" fill="#22c55e"></text>
        <text x="20" y="10" fill="#ccc">Single for-await loop, zero callbacks</text>
      </g>
    </g>
  </g>
</svg>
