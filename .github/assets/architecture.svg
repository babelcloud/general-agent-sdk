      <text x="725" y="125" text-anchor="middle" font-family="'SF Mono', monospace" font-size="11" fill="#00d4ff">MCP Servers</text>
      <text x="725" y="143" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#667085">stdio + HTTP</text>
    </g>

