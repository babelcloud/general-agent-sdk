      <text x="380" y="453" text-anchor="middle" font-family="'SF Mono', monospace" font-size="11" fill="#f59e0b">File Checkpoints</text>
      <text x="380" y="468" text-anchor="middle" font-family="system-ui" font-size="8" fill="#667085">Auto-rollback on mutations</text>
    </g>
    <g filter="url(#cardShadow)">
      <rect x="500" y="432" width="200" height="46" rx="8" fill="#0d1117" stroke="#9d8aff" stroke-opacity="0.2" stroke-width="1"/>
